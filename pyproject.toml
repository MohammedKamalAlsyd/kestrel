[project]
name = "kestrel"
version = "0.1.0"
description = "Kestrel: 350M-700M modern LLM engineered to outperform GPT-2 XL."
readme = "README.md"
authors = [
    { name = "MohammedKamalAlsyd", email = "MohammedKamalAlsyd@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = [
    "datasets>=3.0.0",
    "tiktoken>=0.7.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "zstandard>=0.22",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
kestrel = "kestrel:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
