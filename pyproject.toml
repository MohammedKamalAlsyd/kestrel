[project]
name = "kestrel"
version = "0.1.0"
description = "Kestrel: 350M-700M modern LLM engineered to outperform GPT-2 XL."
readme = "README.md"
authors = [
    { name = "MohammedKamalAlsyd", email = "MohammedKamalAlsyd@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = [
    "datasets>=3.0.0",
    "huggingface-hub>=0.24.0",
    "matplotlib>=3.8",
    "mlflow>=2.14.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "safetensors>=0.4.0",
    "tiktoken>=0.7.0",
    "transformers>=4.45.0",
]
data = [
    "datasets>=3.0.0",
    "tiktoken>=0.7.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
    "transformers>=4.45.0",
    "zstandard>=0.22",
]
eval = [
    "lm-eval>=0.4.5",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
kestrel = "kestrel:main"
kestrel-train = "kestrel.train:main"
kestrel-preflight = "kestrel.metrics.preflight:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
